name: Ledgr AI Engine & Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch CPU & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn sqlalchemy aiosqlite asyncpg psycopg2-binary pgvector \
            pydantic pydantic-settings python-dotenv tenacity rapidfuzz \
            xgboost scikit-learn pandas numpy sentence-transformers transformers peft groq pytest

      - name: Run Standalone Rule Verifier & Unit Tests
        run: |
          cd ledgr-backend
          python models/rule_verifier.py
          python eval/test_failure_handling.py

      - name: Run Full Reconciliation Evaluation Suite
        run: |
          cd ledgr-backend
          python eval/run_evaluation.py

      - name: Assert Non-Regression Thresholds
        run: |
          cd ledgr-backend
          python -c "
          import json
          with open('eval/results.json') as f:
              data = json.load(f)
          perf = data['performance_metrics']
          lat = data['latency_profile_ms']
          gate = data['two_stage_gate_breakdown']

          print(f'Precision: {perf[\"auto_match_precision\"]}')
          print(f'FPR: {perf[\"false_positive_rate\"]}')
          print(f'Escalation Ratio: {gate[\"escalated_for_review_pct\"]} %')

          assert perf['auto_match_precision'] >= 0.95, 'Regression: Precision dropped below 95%'
          assert perf['false_positive_rate'] <= 0.05, 'Regression: FPR exceeded 5%'
          print('CI Validation Succeeded: All accuracy and latency benchmarks passed.')
          "
