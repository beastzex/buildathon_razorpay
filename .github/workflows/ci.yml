name: Ledgr AI Engine & Full-Stack CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-ai-evaluation:
    name: Backend & AI Engine Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install PyTorch CPU & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Standalone Rule Verifier & Unit Tests
        run: |
          cd ledgr-backend
          python models/rule_verifier.py
          python eval/test_failure_handling.py

      - name: Run Full Reconciliation Evaluation Suite
        run: |
          cd ledgr-backend
          python eval/run_evaluation.py

      - name: Assert Non-Regression Thresholds
        run: |
          cd ledgr-backend
          python -c "
          import json
          with open('eval/results.json') as f:
              data = json.load(f)
          perf = data['performance_metrics']
          gate = data['two_stage_gate_breakdown']

          print(f'Precision: {perf[\"auto_match_precision\"]}')
          print(f'Recall: {perf[\"auto_match_recall\"]}')
          print(f'FPR: {perf[\"false_positive_rate\"]}')
          print(f'Escalation Ratio: {gate[\"escalated_for_review_pct\"]} %')

          assert perf['auto_match_precision'] >= 0.90, 'Regression: Precision dropped below 90%'
          assert perf['auto_match_recall'] >= 0.95, 'Regression: Recall dropped below 95%'
          assert perf['false_positive_rate'] <= 0.25, 'Regression: FPR exceeded 25%'
          print('CI Validation Succeeded: All accuracy and non-regression benchmarks passed.')
          "

  frontend-build-check:
    name: Frontend Production Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ledgr-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd ledgr-frontend
          npm ci

      - name: Build Next.js Production Bundle
        run: |
          cd ledgr-frontend
          npm run build
