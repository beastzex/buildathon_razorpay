version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ledgr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgrpass}
      POSTGRES_DB: ${POSTGRES_DB:-ledgr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledgr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgr-backend-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ledgr}:${POSTGRES_PASSWORD:-ledgrpass}@postgres:5432/${POSTGRES_DB:-ledgr}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LEDGR_GROQ_MODEL=openai/gpt-oss-120b
      - LEDGR_AUTO_MATCH_THRESHOLD=0.85
      - LEDGR_REVIEW_THRESHOLD=0.65
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
